<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belépés - Fanni & Zoli esküvő</title>
  <style>
     body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: url("images/login_bg_3.jpg") no-repeat center center fixed;
      background-size: cover /* Ensures the image covers the entire page */
    }
    
    .password-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.8); /* Semi-transparent white background */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    input {
      padding: 10px;
      margin-top: 10px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="password-container">
    <h2>Add meg a jelszót a belépéshez</h2>
    <input type="password" id="password" placeholder="Jelszó/Password">
    <button onclick="validatePassword()">Ok</button>
    <div id="error-message" class="error"></div>
  </div>

  <!-- Link to external JavaScript file -->
  <script src="auth.js"></script> 

</body>
</html>
