<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .password-container {
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    input {
      padding: 10px;
      margin-top: 10px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="password-container">
    <h2>Add meg a jelszót a belépéshez</h2>
    <h4>Enter Password to Access</h4>
    <input type="password" id="password" placeholder="Jelszó/Password">
    <button onclick="validatePassword()">Ok</button>
    <div id="error-message" class="error"></div>
  </div>

  <script>
    const correctPassword = "ready2wed"; // Replace this with your desired password

    function validatePassword() {
      const input = document.getElementById("password").value;
      const errorMessage = document.getElementById("error-message");

      if (input === correctPassword) {
        errorMessage.textContent = "";
        // Redirect to the main page (or load content dynamically)
        window.location.href = "main.html"; // Replace with the URL of your main page
      } else {
        errorMessage.textContent = "Hibás jelszó / Incorrect password";
      }
    }
  </script>
</body>
</html>
